<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trilha do Conhecimento | Prova Paulista</title><meta name="description" content="Estude, pratique e retome suas dificuldades em duas trilhas de revisão de Logística."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%232A629A'/%3E%3Cpath d='M11 12h18v5H18v13h-7z' fill='white'/%3E%3Ccircle cx='27' cy='28' r='5' fill='%23FF7A00'/%3E%3C/svg%3E"><style>
:root{--blue:#2a629a;--navy:#12243c;--muted:#526579;--orange:#ff7a00;--green:#087d59;--line:#dce5ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#d9eafb,transparent 55%),#f3f6fb;color:var(--navy);font:16px/1.65 system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;transition:transform .16s,background .16s}button:hover:not(:disabled){transform:translateY(-2px)}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #ff7a00;outline-offset:4px}h1,h2,h3,p{margin:0 0 16px}h1{font-size:clamp(32px,4vw,52px);line-height:1.14;letter-spacing:-1.7px}h2{font-size:28px;line-height:1.25;letter-spacing:-.7px}h3{font-size:19px;line-height:1.4}small,.small{font-size:14px;color:var(--muted)}header{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1200px)/2));border-bottom:1px solid var(--line);background:#ffffffb8;backdrop-filter:blur(15px);gap:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;line-height:1.25}.logo{width:40px;height:40px;border-radius:13px;background:var(--blue);color:white;display:grid;place-items:center;font-size:25px}.brand small{display:block;font-size:12px;letter-spacing:2px;margin-top:5px;font-weight:600}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:30px;padding:6px 13px;font-size:13px;font-weight:650;background:#fff}.wrap{max-width:1200px;margin:0 auto;padding:44px 24px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:800;color:var(--blue);margin-bottom:16px}.intro{max-width:710px;margin-bottom:32px}.intro p{color:var(--muted);font-size:18px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:28px}.panel{padding:28px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 8px 35px #14365a06}.name{display:flex;align-items:center;gap:16px;margin-bottom:26px}.stepnum{flex-shrink:0;background:#eaf2fa;color:var(--blue);border-radius:12px;width:36px;height:36px;display:grid;place-items:center;font-weight:800}.name label{font-size:15px;font-weight:700}input{width:100%;padding:13px 16px;border:1px solid #bdcbd8;border-radius:12px;background:#fafcfe;color:var(--navy);margin-top:8px}label{display:block}.subjects{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 24px}.subject{text-align:left;padding:24px 20px;border:2px solid var(--line);border-radius:18px;background:white;color:var(--navy);position:relative;min-height:220px}.subject.selected{border-color:var(--blue);background:#f2f7fd}.subject .icon{width:48px;height:48px;background:#e1ecf7;border-radius:14px;display:grid;place-items:center;margin-bottom:24px;color:var(--blue)}.subject.orange .icon{background:#fff0e0;color:#b15300}.subject h3{margin-bottom:8px}.subject .check{position:absolute;right:16px;top:15px;width:21px;height:21px;border:2px solid #c3d0dd;border-radius:50%;display:grid;place-items:center;font-size:12px}.selected .check{background:var(--blue);color:white;border-color:var(--blue)}.primary,.secondary{border:0;border-radius:12px;padding:13px 22px;font-weight:750;background:var(--blue);color:white}.primary.orange{background:var(--orange);color:#23180e}.secondary{background:#eaf1f8;color:var(--blue)}.wide{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.note{padding:14px 17px;background:#fff6e9;border:1px solid #f0d4ac;border-radius:12px;font-size:14px;color:#72430c;margin:16px 0}.aside{background:var(--navy);color:white;border:0;position:sticky;top:24px}.aside small,.aside p{color:#bccddd}.aside h3{margin:16px 0}.path{padding:12px 0 20px 15px;border-left:2px solid #425670;margin-left:12px}.path b{display:block;font-size:15px}.path span{font-size:13px;color:#b9cce0}.timebig{font-size:34px;font-weight:800;letter-spacing:-1px}.aside hr{border:0;border-top:1px solid #415168;margin:24px 0}.footer{text-align:center;font-size:13px;color:var(--muted);padding:28px}.hud{position:sticky;top:0;background:#ffffffed;backdrop-filter:blur(15px);border-bottom:1px solid var(--line);z-index:5;padding:12px 24px;display:flex;justify-content:center;gap:35px;flex-wrap:wrap}.hud b{font-variant-numeric:tabular-nums}.meter{height:9px;background:#e8eef4;border-radius:10px;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;background:var(--blue);border-radius:10px;transition:width .4s}.lesson{white-space:pre-wrap;line-height:1.9}.lesson p{margin-bottom:14px}.content-panel{min-height:420px}.callout{background:#edf5fc;border-left:4px solid var(--blue);padding:18px;border-radius:0 14px 14px 0;margin:25px 0}.actions{margin-top:28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.option{width:100%;display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border:1px solid #c9d6e2;background:white;border-radius:13px;margin:10px 0;color:var(--navy)}.option .letter{flex-shrink:0;width:32px;height:32px;border-radius:8px;background:#eff3f8;display:grid;place-items:center;font-weight:800}.option.chosen{border:2px solid var(--blue);background:#edf5fc}.option.right{border:2px solid var(--green);background:#e9f8f1;opacity:1}.option.wrong{border:2px solid #ba3644;background:#fff0f1;opacity:1}.feedback{padding:20px;border-radius:14px;background:#e9f8f1;margin-top:22px}.feedback.error{background:#fff1e6}.feedback b{display:block;margin-bottom:6px}textarea{width:100%;min-height:240px;padding:18px;border:1px solid #b8c9d9;border-radius:14px;resize:vertical;color:var(--navy);line-height:1.7}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.stat{border:1px solid var(--line);border-radius:16px;padding:22px;background:white}.stat strong{display:block;font-size:30px}.chartrow{margin:20px 0}.bar{height:18px;background:#e7edf4;border-radius:5px;display:flex;overflow:hidden;margin-top:8px}.bar .initial{background:#2a629a}.bar .recovered{background:#10b981}.bar .pending{background:#ff7a00}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:13px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px}.ring span{width:110px;height:110px;background:white;border-radius:50%;display:grid;place-items:center;font-size:29px;font-weight:800;color:var(--navy)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14253f;color:#fff;padding:16px 24px;border-radius:14px;z-index:20;width:max-content;max-width:90vw;box-shadow:0 10px 30px #0002}.hidden{display:none!important}details{border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;background:#fff}summary{cursor:pointer;font-weight:700}.student-text{white-space:pre-wrap;overflow-wrap:anywhere;height:auto;max-height:none}#print{display:none}svg{width:26px;height:26px} .mono{font-variant-numeric:tabular-nums}.station{color:#6f8296;font-size:14px;margin-bottom:10px}.station.active{color:var(--blue);font-weight:750}.empty{padding:16px;background:#f0f5fa;border-radius:12px}@media(max-width:800px){header{height:72px;padding:0 18px}header>.pill{display:none}.wrap{padding:28px 18px}.grid{grid-template-columns:1fr}.aside{position:static}.subjects{gap:12px}.subject{padding:18px 14px}.panel{padding:22px}.hud{gap:12px;font-size:13px}.statgrid{gap:9px}.stat{padding:14px}.stat strong{font-size:24px}}@media(max-width:430px){.subjects{grid-template-columns:1fr}.subject{min-height:0;display:grid;grid-template-columns:44px 1fr;gap:10px}.subject .icon{grid-row:1/3;margin:0;width:40px;height:40px}.subject h3{padding-right:14px;font-size:17px}.subject small{grid-column:2}.subject .check{right:10px;top:10px}.intro p{font-size:16px}.statgrid{grid-template-columns:1fr}.stat{display:flex;justify-content:space-between;align-items:center}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}@media print{body{background:white;font-size:11pt}body>*:not(#print){display:none!important}#print{display:block!important;color:black}#print h2{margin-top:24px}#print .student-text{white-space:pre-wrap;overflow:visible;max-height:none;height:auto;break-inside:auto;page-break-inside:auto}#print section{break-inside:auto}#print .report-q{border-bottom:1px solid #aaa;padding:12px 0} @page{margin:18mm}}
</style></head><body><header><div class="brand"><span class="logo">T</span><div>Trilha do Conhecimento<small>PROVA PAULISTA · LOGÍSTICA</small></div></div><span class="pill">Aprender. Praticar. Evoluir.</span></header><div id="hud"></div><main id="app"></main><footer class="footer">Seu ritmo, seu progresso. Uma habilidade de cada vez.</footer><div id="toast" role="status" class="toast hidden"></div><div id="print"></div><script>
const DATA={"estoques": {"title": "Planejamento e Organização de Estoques", "short": "Estoques", "tag": "10 aulas do compêndio", "note": "Conteúdo baseado nas aulas 1 a 10 e nas questões de Estoques do compêndio enviado.", "lessons": [{"title": "Importância, Objetivos e Obrigações na Gestão de Estoques", "body": "Habilidade(s) Relacionada(s): Classificação, categorização, cálculo e previsão de demanda em gestão de estoques.\n Conceitos Chave & Teoria:\n  - Procedimento de Contagem: Consiste na verificação física dos materiais armazenados em um período definido, comparando as quantidades físicas apuradas com os registros em sistemas WMS (Warehouse Management System), ERPs, planilhas ou formulários internos.\n  - Importância do Registro: O registro rigoroso e atualizado de todas as movimentações (entradas, saídas, avarias e devoluções) garante a confiabilidade das informações, evitando divergências entre o estoque físico e o sistema contábil.\n  - Classificação e Categorização: Mecanismo pedagógico e gerencial que agrupa itens segundo critérios de relevância. A Curva ABC hierarquiza os produtos com base no valor financeiro e no impacto operacional, permitindo priorizar esforços de controle nos itens de maior importância.\n Aplicações Práticas & Exemplos: Empresas de grande porte utilizam a classificação ABC para evitar que produtos de alto valor agregado fiquem sem acompanhamento rigoroso, mantendo auditorias diárias sobre a Classe A enquanto itens da Classe C recebem verificações espaçadas."}, {"title": "Métodos de Contagem – Permanente, Periódica, Manual e por Amostragem", "body": "Habilidade(s) Relacionada(s): Seleção e implementação de técnicas de inventário conforme a estrutura operacional.\n Conceitos Chave & Teoria:\n  - Contagem Permanente (Contínua): Atualização do saldo de estoque em tempo real a cada entrada ou saída. Exige integração com leitores ópticos ou sistemas WMS/ERP. Indicada para operações de alto giro ou itens de elevado valor unitário.\n  - Contagem Periódica: Realizada em intervalos fixos e pré-programados (mensal, trimestral ou anual). As informações do sistema não são atualizadas item a item durante o período, ocorrendo a checagem concentrada na data marcada.\n  - Contagem Manual: Realizada diretamente pelos colaboradores por meio do preenchimento de formulários impressos em prateleiras e gôndolas. Comum em pequenos comércios ou lojas sem automação.\n  - Contagem por Amostragem: Verificação de apenas uma parcela selecionada das prateleiras ou setores para identificar padrões de erros, perdas, excessos ou rupturas.\n  - Papel dos Formulários: Instrumentos indispensáveis para padronizar o registro de unidades, descrições, quantidades apuradas e dados do sistema, facilitando a identificação imediata de divergências.\n Aplicações Práticas & Exemplos: Na rede de lojas fictícia Tem Tudo, o setor de eletrônicos (alto valor e giro elevado) adota a contagem permanente para impedir vendas de produtos indisponíveis. Já lojas menores da rede adotam a contagem periódica mensal para peças de vestuário e calçados."}, {"title": "Planejamento Antecipado, Inventário Geral e Inventário Cíclico", "body": "Habilidade(s) Relacionada(s): Planejamento operacional de inventários física e financeiramente sustentáveis.\n Conceitos Chave & Teoria:\n  - Planejamento Antecipado: Etapa crucial que envolve a definição prévia de escopo, cronograma, alocação de equipes, treinamento e disponibilização de recursos tecnológicos e operacionais (leitores de código de barras, etiquetas, empilhadeiras, elevadores e softwares de gestão).\n  - Inventário Geral: Contagem física integral de todos os materiais do estabelecimento realizada de uma só vez. Trata-se de um processo longo e complexo que pode exigir a paralisação parcial ou total das operações, sendo utilizado principalmente para fins contábeis e atendimento a exigências legais ao fim do ano fiscal (Balanço Patrimonial).\n  - Inventário Cíclico ou Rotativo: Recontagem contínua e fracionada do estoque organizada em ciclos diários ou semanais por grupos de produtos, áreas ou categorias. Permite manter o controle de acuracidade sem interromper o funcionamento normal da empresa.\n Aplicações Práticas & Exemplos: Supermercados e centros de distribuição aplicam o inventário rotativo contando corredores ou categorias específicas por dia da semana (ex: bebidas na segunda-feira, limpeza na terça-feira), garantindo acuracidade sem fechar as portas aos clientes."}, {"title": "Condução da Contagem e Critérios de Organização Cíclica", "body": "Habilidade(s) Relacionada(s): Mitigação de rupturas e excessos através de estratégias rotativas.\n Conceitos Chave & Teoria:\n  - Vantagens da Contagem Cíclica: Permite identificar discrepâncias rapidamente, elevar a confiabilidade dos registros, diminuir rupturas nas prateleiras, evitar excessos e otimizar a reposição entre matriz e filiais.\n  - Critérios de Aplicação da Contagem Cíclica:\n    1. Por Classificação ABC: Os itens da Classe A são contados com alta frequência (ex: semanalmente), enquanto as Classes B e C possuem ciclos mais espaçados (ex: mensais ou bimestrais).\n    2. Por Localização: Dividido por setores, corredores ou prateleiras (ex: um corredor por dia).\n    3. Por Tipo de Produto: Agrupamento por famílias de materiais semelhantes (vestuário, eletrônicos, casa) em ciclos distintos.\n    4. Por Criticidade: Foco prioritário em itens com histórico de divergências, alto risco de furto ou produtos em promoção.\n Aplicações Práticas & Exemplos: Na loja Tem Tudo, os itens eletrônicos (Classe A e alta criticidade) passam por contagem rotativa semanal, enquanto artigos de utilidade doméstica (Classes B e C) cumprem ciclo mensal."}, {"title": "Ferramentas de Melhoria Contínua – Kanban, Just-in-Time e Acuracidade", "body": "Habilidade(s) Relacionada(s): Aplicação de ferramentas enxutas (Lean) e garantia da acuracidade das informações de estoque.\n Conceitos Chave & Teoria:\n  - Acuracidade de Estoque: Percentual de conformidade entre o estoque físico real e as quantidades registradas no sistema. A alta acuracidade é premissa básica para o planejamento de compras e atendimento de pedidos.\n  - Análise de Discrepâncias e Reconciliação: Processo de investigação das causas-raiz das diferenças (erros de digitação, furtos, extravios, trocas de código) seguido do ajuste formal do saldo.\n  - Sistema Kanban: Ferramenta visual de controle de fluxo que utiliza cartões ou sinalizadores para indicar a necessidade de reposição de itens, impedindo superprodução e acúmulo desnecessário de estoque.\n  - Just-in-Time (JIT): Filosofia de gestão na qual a produção e o suprimento ocorrem no momento exato em que são necessários, reduzindo drasticamente os níveis de estoque e custos de armazenagem.\n Aplicações Práticas & Exemplos: Linhas de montagem industriais utilizam cartões Kanban anexados aos caixas de componentes; quando uma caixa esvazia, o cartão retorna ao almoxarifado ativando o envio de um novo lote dimensionado via JIT."}, {"title": "Processo Logístico Integrado – Estudo de Caso de Hemocentros e Saúde", "body": "Habilidade(s) Relacionada(s): Mapeamento do fluxo logístico de ponta a ponta e gestão de riscos em cadeias de suprimentos de alta criticidade.\n Conceitos Chave & Teoria:\n  - Fases do Fluxo Logístico em Hemocentros:\n    1. Registro e Triagem: Primeiro ponto de controle do estoque. Identifica o doador, garante a rastreabilidade inicial e atua como filtro de qualidade.\n    2. Coleta: Extração do insumo por procedimentos padronizados em sacos coletores estéreis.\n    3. Processamento e Testes Laboratoriais: Centrifugação para separação dos componentes (hemácias, plasma e plaquetas) e realização de testes de triagem sorológica (HIV, Hepatites, Sífilis, Chagas), com posterior liberação ou descarte seguro.\n    4. Armazenamento: Conservação sob rigoroso controle de temperatura conforme as especificações técnicas de cada hemoderivado.\n    5. Distribuição e Transfusão: Transporte refrigerado rastreável até hospitais/clínicas para administração ao paciente receptor, finalizando com o acompanhamento pós-transfusional.\n  - Integração das Etapas: A eficiência logística depende do encadeamento perfeito das etapas. O rompimento em qualquer fase prejudica todo o fluxo e pode comprometer vidas.\n Aplicações Práticas & Exemplos: Um atraso na distribuição de hemoderivados ou a falta de rastreabilidade de uma bolsa de sangue inviabiliza transfusões de emergência nos hospitais solicitantes."}, {"title": "Organização Estrutural de Estoques – Estudo de Caso CD LogMais", "body": "Habilidade(s) Relacionada(s): Identificação e correção de ineficiências operacionais na armazenagem.\n Conceitos Chave & Teoria:\n  - Diagnóstico da Desorganização: Estoques armazenados sem critérios definidos e com cadastros desatualizados geram falhas graves, tais como atrasos na separação (picking), envio de itens incorretos e perdas financeiras.\n  - Diretrizes para Reorganização de Armazéns:\n    1. Categorização: Separação dos produtos por tipo, família ou finalidade.\n    2. Definição de Prioridades: Endereçamento alinhado ao giro e à taxa de saída dos itens.\n    3. Padronização de Cadastros: Padronização rigorosa de descrições, códigos e unidades de medida no sistema ERP/WMS.\n    4. Inventários Periódicos: Rotina constante de checagem para manter a base de dados fidedigna.\n Aplicações Práticas & Exemplos: O CD LogMais reestruturou seu armazém padronizando os códigos de barras e agrupando itens por categoria, reduzindo o tempo de preparação de pedidos e zerando os erros de despachos incorretos."}, {"title": "Gestão de Espaço Físico, Fornecedores e Capacitação de Colaboradores", "body": "Habilidade(s) Relacionada(s): Proposição de ações integradas entre layout, fornecedores e recursos humanos.\n Conceitos Chave & Teoria:\n  - Relacionamento com Fornecedores: O alinhamento das rotinas de entrega e o cumprimento dos prazos de entrega (lead time) evitam rupturas na entrada e excesso de estoque na recepção.\n  - Treinamento e Padronização: Processos organizados dependem do preparo da equipe. A capacitação contínua reduz falhas operacionais na movimentação e no registro de entradas e saídas.\n  - Gestão do Espaço Físico (Layout): A avaliação do layout otimiza as rotas internas de circulação de empilhadeiras e operadores, aumentando a segurança e acelerando as rotinas de separação e armazenagem.\n Aplicações Práticas & Exemplos: Armazéns logísticos redefinem o posicionamento de itens de alta rotatividade para áreas próximas às docas de expedição, diminuindo os deslocamentos dos operadores."}, {"title": "Parâmetros Operacionais e Tecnologias Automatizadas de Identificação", "body": "Habilidade(s) Relacionada(s): Dimensionamento de níveis de estoque e adoção de automação na identificação de materiais.\n Conceitos Chave & Teoria:\n  - Sazonalidade: Flutuações previsíveis na demanda motivadas por períodos específicos do ano (ex: ovos de Páscoa, artigos escolares em janeiro, condicionadores de ar no verão). O planejamento deve antecipar a elevação temporária do estoque sem gerar excedentes pós-data.\n  - Sistemas de Identificação Automatizados:\n    1. Código de Barras e QR Code: Permitem leitura óptica rápida e registro instantâneo no sistema.\n    2. RFID (Identificação por Radiofrequência): Utiliza etiquetas inteligentes com chips e antenas, permitindo a leitura de múltiplos itens simultaneamente e sem necessidade de campo de visão direto.\n  - Níveis Mínimos e Máximos de Estoque:\n    - Estoque Mínimo (Segurança): Quantidade reserva para cobrir oscilações inesperadas na demanda ou atrasos na entrega dos fornecedores.\n    - Estoque Máximo: Limite superior estipulado para evitar imobilização excessiva de capital e sobrecarga da capacidade física de armazenagem.\n  - Análise dos Mais e Menos Vendidos: Permite rearranjar o layout e planejar promoções ou descontinuação de itens sem saída.\n Aplicações Práticas & Exemplos: Lojas de departamentos que aplicam etiquetas RFID realizam a contagem de um palete inteiro em poucos segundos utilizando leitores portáteis, reduzindo drasticamente o tempo de inventário."}, {"title": "Previsão de Demanda, Cálculo de Insumos e Nível de Ressuprimento", "body": "Habilidade(s) Relacionada(s): Cálculo de previsões de vendas e dimensionamento matemático de compras e reposições.\n Conceitos Chave & Teoria:\n  - Previsão de Demanda: Metodologia quantitativa ou qualitativa para estimar as vendas futuras com base no histórico recente e em dados de mercado, norteando as ordens de produção e aquisição de matéria-prima.\n  - Nível de Ressuprimento (Ponto de Pedido): Quantidade limite no estoque que aciona a emissão automática de uma nova ordem de compra, garantindo que o novo lote chegue antes do esgotamento do estoque de segurança.\n  - Dimensionamento de Insumos: Cálculo da quantidade exata de matérias-primas e componentes necessários para cumprir a meta da previsão de produção.\n Aplicações Práticas & Exemplos: Em uma fábrica de confecção textil, calcula-se a previsão de vendas de 50.883 camisas (entre modelos Manga Curt, Manga Longa e Polo nas cores branca, azul e verde), multiplicando a demanda pelas necessidades de tecido e botões para definir as ordens exatas de compras."}], "questions": [{"id": "e1", "prompt": "Qual é a estratégia mais recomendada para gerenciar os estoques em empresas que operam com ampla variedade de produtos e restrição de recursos para auditorias integrais?", "options": ["Realizar contagem manual diária de todos os itens do armazém.", "Classificar os produtos em categorias por valor e impacto através da Curva ABC.", "Eliminar a realização de inventários físicos e confiar apenas nas notas fiscais de entrada.", "Armazenar todos os materiais sem separação por categorias para otimizar espaço.", "Realizar o encerramento das vendas sempre que for necessário conferir um produto."], "correct": 1, "explain": "A Classificação ABC permite priorizar a atenção e o controle sobre os produtos de maior valor e impacto financeiro (Classe A), otimizando a aplicação de recursos e tempo na gestão de estoques.", "skill": "Classificação ABC", "source": true}, {"id": "e2", "prompt": "Para garantir registros de estoque confiáveis em diferentes formatos de lojas no varejo, qual procedimento deve ser adotado pela equipe de logística?", "options": ["Aplicar o mesmo formulário genérico em todas as unidades, independentemente do porte.", "Escolher o método de contagem adequado às características operacionais de cada unidade e categoria.", "Substituir todas as conferências físicas por estimativas visuais semanais.", "Realizar contagens apenas quando forem identificadas reclamações de clientes.", "Manter o estoque congelado durante todo o ano letivo."], "correct": 1, "explain": "Cada formato de loja e perfil de produto demanda um método de contagem específico (permanente, periódica, manual ou amostragem) para assegurar o alinhamento entre o estoque físico e o sistema.", "skill": "Métodos de contagem", "source": true}, {"id": "e3", "prompt": "Como uma organização pode conduzir a contagem geral dos seus materiais minimizando o impacto negativo de paralisações na sua operação comercial?", "options": ["Cancelando o inventário geral e realizando apenas estimativas de final do ano.", "Planejando a contagem geral antecipadamente e executando o processo em etapas.", "Transferindo todo o estoque para as lojas de clientes antes de contar.", "Realizando a contagem física durante o horário de maior movimento de clientes.", "Terceirizando o processo sem definir cronogramas ou alocação de equipes."], "correct": 1, "explain": "O planejamento antecipado possibilita organizar a alocação de equipes, preparar recursos e estruturar a execução por etapas, reduzindo paralisações indesejadas.", "skill": "Planejamento de inventário", "source": true}, {"id": "e5", "prompt": "Ao final do exercício fiscal, qual instrumento contábil-financeiro é elaborado a partir dos dados consolidados no inventário geral de estoque?", "options": ["Fluxo de caixa diário da operação.", "Balanço Patrimonial da empresa.", "Curva de tendência do mercado.", "Plano de marketing anual.", "Folha de pagamento dos colaboradores."], "correct": 1, "explain": "O Balanço Patrimonial exige a apuração física e contábil completa do estoque no encerramento do ano fiscal para demonstrar o ativo real da empresa.", "skill": "Inventário geral", "source": true}, {"id": "e6", "prompt": "Durante a distribuição de componentes sanguíneos para transfusão, qual falha no processo de logística representa o risco mais crítico à saúde do paciente?", "options": ["Demanda baixa por determinados tipos sanguíneos.", "Ausência de rastreabilidade ou falha na identificação do insumo.", "Excesso de formulários cadastrais preenchidos na recepção.", "Utilização de embalagens cartonadas descartáveis na entrega.", "Realização do transporte no período matutino."], "correct": 1, "explain": "A falta de rastreabilidade impede confirmar a origem, os testes e a compatibilidade do sangue, podendo levar à administração de bolsa inadequada e provocar reações transfusionais fatais.", "skill": "Rastreabilidade", "source": true}, {"id": "e7", "prompt": "Ao identificar um indicador de tendência de alta nas vendas de uma linha de produtos para os próximos meses, qual providência imediata deve ser tomada pelo setor de compras e estoques?", "options": ["Suspender os pedidos de compra para conter despesas.", "Reduzir o nível de estoque de segurança a zero.", "Aumentar o planejamento de compras para evitar rupturas de estoque.", "Manter rigorosamente os mesmos volumes comprados no ano anterior.", "Desativar o sistema de monitoramento de entradas e saídas."], "correct": 2, "explain": "A previsão de demanda subsidia o planejamento de suprimentos; antecipar a tendência de alta nas vendas exige adequar as compras para prevenir desabastecimentos (rupturas).", "skill": "Previsão de demanda", "source": true}, {"id": "e8", "prompt": "Qual parâmetro da gestão de estoques determina o momento exato em que uma nova ordem de compra deve ser emitida junto aos fornecedores?", "options": ["Nível de Ressuprimento (Ponto de Pedido).", "Lote Máximo de Descarte.", "Capacidade Total do Armazém.", "Giro de Estoque Trimestral.", "Índice de Avarias por Transporte."], "correct": 0, "explain": "O Nível de Ressuprimento indica o limite de unidades que aciona a emissão de novo pedido a tempo do lote ser entregue antes do esgotamento do estoque.", "skill": "Ressuprimento", "source": true}], "writing": ["Na rede Tem Tudo, compare contagem permanente e periódica. Proponha uma estratégia para lojas de diferentes portes e justifique a escolha entre contagem integral manual e amostragem quando não há WMS/ERP.", "Elabore um plano de ação para o CD LogMais: organização por categoria, cadastros, giro, layout, fornecedores e treinamento. Explique como monitorar resultados e evitar rupturas."]}, "carreira": {"title": "Carreira e Competências", "short": "Carreira", "tag": "Recorte: comunicação e feedback SCI", "note": "O arquivo contém apenas uma questão deste componente (questão 4, modelo SCI). Esta trilha aprofunda esse recorte com situações adaptadas; não representa uma revisão completa do bimestre.", "lessons": [{"title": "Feedback que ajuda a equipe", "body": "Você participa de uma equipe de logística. Uma diferença na execução de uma tarefa precisa ser conversada. O material apresenta o modelo SCI para transmitir feedbacks objetivos, evitando julgamentos pessoais. A conversa descreve a situação factual, o comportamento observado e o impacto gerado. O foco é o que aconteceu, não um rótulo sobre quem a pessoa é.\n\nCompare: “Você é desorganizado” e “Na separação do pedido de hoje, dois itens foram colocados em endereços diferentes dos registrados, atrasando a conferência”. A segunda frase descreve um episódio e uma consequência. Este cenário é uma aplicação didática do modelo presente na questão 4."}, {"title": "S de Situação: localize o episódio", "body": "A situação apresenta o contexto factual da conversa. Quando e em qual tarefa aconteceu o episódio? “Durante a conferência do pedido desta manhã” delimita uma situação. “Você sempre faz isso” generaliza e não localiza um fato.\n\nNo SCI, um contexto específico ajuda a equipe a reconhecer o episódio de que se está falando. Pense em uma atividade de logística: recebimento, separação ou registro. Descreva uma situação sem atribuir culpa ou inventar intenção."}, {"title": "C de Comportamento: descreva o observável", "body": "O comportamento é a ação observada. “Três saídas ficaram sem registro” descreve o que aconteceu. “Você não se importa com a equipe” atribui uma intenção que não foi observada.\n\nUm feedback objetivo separa a pessoa da ação. No caso de um cadastro incompleto, relate o campo não preenchido ou o registro que faltou. Evite palavras que transformem um episódio em um julgamento sobre a personalidade."}, {"title": "I de Impacto: mostre a consequência", "body": "O impacto explica a consequência do comportamento na situação descrita. “A equipe precisou repetir a conferência” apresenta um efeito. “Você é um problema” é julgamento, não consequência operacional.\n\nConecte ação e efeito: o registro não foi atualizado, então a equipe não conseguiu conferir o saldo com segurança. Não é necessário exagerar a consequência. Relate o impacto que pode ser explicado a partir do episódio."}, {"title": "Monte a mensagem completa", "body": "Junte as três partes: “Na conferência desta manhã [situação], duas quantidades ficaram sem registro [comportamento], e a equipe precisou repetir a checagem [impacto]”.\n\nLeia a mensagem e verifique: há um contexto reconhecível? Uma ação observada? Uma consequência? Retire julgamentos pessoais. Esse é o princípio do SCI apresentado no compêndio: organizar a comunicação para torná-la objetiva e construtiva."}, {"title": "Reconheça julgamentos disfarçados", "body": "“Na reunião de hoje, você mostrou que é irresponsável e prejudica tudo” começa com uma situação, mas continua com rótulos. Apenas mencionar uma data não torna a mensagem objetiva.\n\nReescreva mentalmente: qual ação foi observada? Qual efeito ocorreu? O SCI não exige julgar o caráter do colega. Exige tornar o fato, a ação e a consequência compreensíveis."}, {"title": "Diferencie ação e consequência", "body": "“Não preencheu a quantidade no formulário” é comportamento. “A conferência precisou ser refeita” é impacto. “Durante o recebimento da manhã” é situação.\n\nConfundir as partes torna o feedback menos claro. Organize os trechos na ordem Situação, Comportamento e Impacto e explique a ligação entre eles. O modelo não é apenas uma sigla para memorizar; ele organiza a mensagem."}, {"title": "Feedback sem adivinhar intenções", "body": "“Você fez isso para atrapalhar” supõe uma intenção. O modelo fornecido orienta a descrição factual, sem julgamentos subjetivos. Uma alternativa é relatar o episódio, a ação e o efeito percebido.\n\nNa próxima mensagem, substitua a intenção presumida por um comportamento observável. Use um caso de registro, contagem ou separação e mantenha a descrição específica."}, {"title": "Aplique em um caso de logística", "body": "Na separação de um pedido, um código foi registrado de forma diferente do item físico. A conferência teve de ser repetida. Como comunicar isso?\n\nSituação: durante a separação daquele pedido. Comportamento: o código foi registrado de forma diferente do item. Impacto: a equipe precisou repetir a conferência. O caso é adaptado para praticar o SCI; não é uma questão oficial adicional."}, {"title": "Revise antes de conversar", "body": "Faça três perguntas: em que situação aconteceu? O que foi observado? Qual impacto ocorreu? Se uma resposta contém apenas um rótulo, reformule.\n\nAgora você vai aplicar o modelo em escolhas e em uma produção escrita. O diagnóstico identifica qual parte da comunicação precisa de reforço. Acertar depois de revisar demonstra recuperação nesta atividade, não comprova domínio de todo o componente Carreira e Competências."}], "questions": [{"id": "e4", "prompt": "Qual modelo estruturado de comunicação auxilia na transmissão de feedbacks objetivos entre membros de uma equipe de logística, evitando julgamentos pessoais?", "options": ["Modelo SWOT de análise de forças e fraquezas.", "Modelo SCI (Situação, Comportamento e Impacto).", "Diagrama de Ishikawa de causa e efeito.", "Metodologia 5S de organização de ambientes.", "Matriz GUT de priorização de problemas."], "correct": 1, "explain": "O modelo SCI organiza a mensagem descrevendo a situação factual, o comportamento observado e o impacto gerado, promovendo comunicação construtiva sem julgamentos subjetivos.", "skill": "Feedback SCI", "source": true}, {"id": "c0", "prompt": "Qual trecho descreve a SITUAÇÃO?", "options": ["Durante a conferência desta manhã.", "Você é desatento.", "A equipe repetiu o trabalho.", "Duas quantidades ficaram sem registro."], "correct": 0, "skill": "Situação", "explain": "A situação localiza o episódio no contexto da tarefa.", "source": false}, {"id": "c1", "prompt": "Qual trecho descreve um COMPORTAMENTO observável?", "options": ["Você não liga para ninguém.", "Duas saídas ficaram sem registro.", "A entrega atrasou como consequência.", "No recebimento de ontem."], "correct": 1, "skill": "Comportamento", "explain": "O comportamento relata uma ação observada, sem atribuir intenção.", "source": false}, {"id": "c2", "prompt": "Qual trecho descreve o IMPACTO?", "options": ["Na separação de hoje.", "Um código foi digitado incorretamente.", "A conferência precisou ser refeita.", "Você é incapaz."], "correct": 2, "skill": "Impacto", "explain": "O impacto é a consequência da ação na situação descrita.", "source": false}, {"id": "c3", "prompt": "Qual mensagem aplica as três partes do SCI?", "options": ["Você sempre erra tudo.", "Melhore sua atitude.", "O pedido atrasou.", "Na separação de hoje, um código ficou incorreto e a conferência precisou ser refeita."], "correct": 3, "skill": "Feedback SCI", "explain": "A mensagem contém contexto, ação observada e consequência.", "source": false}, {"id": "c4", "prompt": "Qual frase deve ser reformulada por conter julgamento pessoal?", "options": ["Durante a contagem de ontem.", "Você é irresponsável.", "Dois itens não foram contados.", "Foi necessário repetir a contagem."], "correct": 1, "skill": "Objetividade", "explain": "Irresponsável é um rótulo pessoal, não a descrição de um comportamento observado.", "source": false}, {"id": "c5", "prompt": "Qual sequência organiza o modelo SCI?", "options": ["Impacto, intenção e julgamento.", "Situação, comportamento e impacto.", "Solução, custo e inventário.", "Situação, caráter e intenção."], "correct": 1, "skill": "Feedback SCI", "explain": "A sigla organiza a mensagem em Situação, Comportamento e Impacto.", "source": false}, {"id": "c6", "prompt": "Como substituir “Você fez isso para atrapalhar” por uma observação?", "options": ["Você sempre atrapalha.", "Você nunca aprende.", "O campo de quantidade ficou sem preenchimento.", "Sua intenção foi ruim."], "correct": 2, "skill": "Objetividade", "explain": "Relatar o campo não preenchido descreve o fato sem presumir intenções.", "source": false}], "writing": ["Descreva um episódio de uma equipe de logística e escreva um feedback completo. Identifique a Situação, o Comportamento observado e o Impacto. Explique por que sua mensagem evita julgamentos pessoais.", "Reformule a frase “Você é desorganizado e só atrapalha a equipe” em um feedback SCI contextualizado na logística. Explique cada parte e diferencie observação, consequência e julgamento."]}};
const KEY='trilha-paulista-v1';let state={name:'',selected:'estoques',current:null,sessions:{}};try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&old.sessions)state=old}catch{}let selection=null,lastTick=Date.now(),lastInteraction=Date.now();const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;const S=()=>state.sessions[state.current];const D=()=>DATA[state.current];let storageWarned=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{if(!storageWarned){storageWarned=true;toast('Este navegador não está salvando o progresso. Mantenha a página aberta e exporte seu relatório.')}}}function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),6500)}function icon(type){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">${type==='carreira'?'<rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V4h8v3M3 12h18M10 11v4h4v-4"/>':'<path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10M7 4.8l9 5"/>'}</svg>`}function doneCount(s){return s.tasks.filter((t,i)=>i<s.pos).length}function home(){state.current=null;save();render()}
function render(){document.getElementById('hud').innerHTML='';if(!state.current){renderHome();return}const s=S();if(s.status!=='active'){renderResult();return}if(Date.now()-s.started>=2700000){finish(true);return}renderStudy();hud()}
function renderHome(){app.innerHTML=`<div class="wrap"><div class="intro"><div class="eyebrow">Sua próxima conquista começa aqui</div><h1>Vamos transformar revisão<br>em conhecimento?</h1><p>Escolha sua matéria, encare os desafios e dê uma segunda chance ao que ainda precisa aprender.</p></div><div class="grid"><section class="panel"><div class="name"><span class="stepnum">1</span><div style="width:100%"><label for="name">Como podemos chamar você?</label><input id="name" maxlength="90" autocomplete="name" placeholder="Digite seu nome completo" value="${esc(state.name)}" ${Object.keys(state.sessions).length?'readonly':''}></div></div><div class="row"><div style="display:flex;gap:16px;align-items:center"><span class="stepnum">2</span><b>Qual revisão você quer fazer primeiro?</b></div></div><div class="subjects">${Object.entries(DATA).map(([k,d])=>`<button class="subject ${k==='carreira'?'orange':''} ${state.selected===k?'selected':''}" data-subject="${k}" aria-pressed="${state.selected===k}"><span class="check">${state.selected===k?'✓':''}</span><span class="icon">${icon(k)}</span><h3>${d.title}</h3><small>${d.tag}${state.sessions[k]?`<br><b>${state.sessions[k].status==='active'?'Em andamento':'Relatório disponível'}</b>`:''}</small></button>`).join('')}</div><div class="note">${esc(DATA[state.selected].note)}</div><button id="start" class="primary orange wide">${state.sessions[state.selected]?(state.sessions[state.selected].status==='active'?'Retomar minha revisão':'Ver meu resultado'):'Começar minha revisão'} →</button><p class="small" style="margin:14px 0 0;text-align:center">Progresso salvo neste navegador. Sem sincronização entre aparelhos.</p></section><aside><div class="panel aside"><span class="pill" style="color:#12243c">SUA MISSÃO</span><h3>Foco no que você<br>ainda precisa aprender.</h3><div class="timebig">25–45 <span style="font-size:18px;font-weight:500">min / matéria</span></div><small>25 min de estudo ativo para concluir.<br>45 min corridos para encerrar a sessão.</small><hr><div class="path"><b>01 · Explore os conceitos</b><span>Duas estações com leituras guiadas</span></div><div class="path"><b>02 · Coloque em prática</b><span>Quiz e decisões por escrito</span></div><div class="path"><b>03 · Recupere os erros</b><span>As questões voltam no reforço final</span></div><div class="path" style="border:0"><b>04 · Veja sua evolução</b><span>Mapa de habilidades e relatório</span></div></div><p class="small" style="padding:16px">Uma questão errada não é o fim da trilha. É o caminho para saber o que revisar.</p></aside></div><details><summary>Antes de começar: tempo, foco e avaliação</summary><p>O tempo ativo conta com a página visível e interação recente (até 60 segundos). Ao ficar inativo, interaja para continuar. O limite de 45 minutos corre desde o início, inclusive se fechar a página. Ao atingir o limite, a sessão é encerrada com as pendências registradas.</p><p>Trocar de aba e tentar colar na produção escrita registra um vacilo (−1 ponto na média). A primeira resposta é definitiva; o reforço registra a recuperação separadamente. Produções escritas exigem 300 caracteres e precisam da avaliação do professor.</p><p>Tela cheia é solicitada quando o navegador permite. Em celulares sem suporte, a atividade continua normalmente. O registro de foco não comprova fraude nem garante atenção.</p></details></div>`;document.getElementById('name').oninput=e=>{state.name=e.target.value;save()};document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.subject;save();renderHome()});document.getElementById('start').onclick=start}
function start(){if(!state.name.trim()){toast('Digite seu nome antes de começar.');document.getElementById('name').focus();return}state.current=state.selected;if(!S()){const d=D(),tasks=[];for(let station=0;station<2;station++){for(let i=station*5;i<station*5+5;i++)tasks.push({type:'lesson',i,station});d.questions.forEach((q,i)=>{if((i<Math.ceil(d.questions.length/2)?0:1)===station)tasks.push({type:'quiz',i,station})});tasks.push({type:'write',i:station,station})}state.sessions[state.current]={started:Date.now(),active:0,status:'active',pos:0,tasks,answers:{},writings:['',''],written:[false,false],vacilos:0,events:[],taskTime:{},checks:{},retry:[],recovered:[],attempts:[],practice:0};}lastTick=Date.now();lastInteraction=Date.now();selection=null;save();if(S().status==='active'&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});render()}
function currentTask(){const s=S();if(s.pos<s.tasks.length)return s.tasks[s.pos];if(s.retry.length)return {type:'retry',i:s.retry[0],station:2};return {type:'practice',i:s.practice%D().lessons.length,station:2}}
function hud(){const s=S();if(!s||s.status!=='active')return;const remain=Math.max(0,2700-(Date.now()-s.started)/1000);document.getElementById('hud').innerHTML=`<div class="hud"><span>⏱ Restam <b>${fmt(remain)}</b></span><span>Estudo ativo <b>${fmt(s.active)} / 25:00</b></span><span>Vacilos <b>${s.vacilos}</b></span><span>${s.pos>=s.tasks.length?'Reforço final':`Etapa ${s.pos+1}/${s.tasks.length}`}</span></div>`;const hint=document.getElementById('timehint');if(hint)hint.textContent=s.active>=1500?'Tempo mínimo cumprido. Conclua as atividades pendentes.':`Faltam ${fmt(1500-s.active)} de estudo ativo para concluir.`;const finishBtn=document.getElementById('finish');if(finishBtn)finishBtn.disabled=!canFinish();const next=document.getElementById('readnext');if(next)next.disabled=(s.taskTime[s.pos]||0)<60||!s.checks[s.pos];const rt=document.getElementById('readtime');if(rt)rt.textContent=`${fmt(Math.min(60,s.taskTime[s.pos]||0))} / 01:00 de leitura ativa`;const inactive=document.getElementById('inactive');if(inactive)inactive.textContent=Date.now()-lastInteraction>60000?'Tempo ativo pausado. Toque ou role a página para continuar.':'Seu estudo está em andamento.'}
function renderStudy(){const s=S(),d=D(),t=currentTask();let body='';const q=d.questions[t.i];if(t.type==='lesson'||t.type==='practice'){const l=d.lessons[t.i];body=`<div class="eyebrow">${t.type==='practice'?'Consolidação · continue estudando':`Leitura guiada · ${t.i+1} de 10`}</div><h2>${esc(l.title)}</h2><div class="lesson">${esc(l.body)}</div><div class="callout"><b>${esc(state.name.split(' ')[0])}, você no comando</b><p style="margin:8px 0 0">Explique com suas palavras a decisão principal deste conteúdo. Que erro você evitaria ao aplicá-lo?</p></div>${t.type==='lesson'?`<label><input id="readcheck" type="checkbox" style="width:auto;margin-right:10px" ${s.checks[s.pos]?'checked':''}> Li o conteúdo e consigo explicar a ideia principal.</label><div class="actions"><button id="readnext" class="primary" disabled>Praticar o próximo passo →</button><small id="readtime"></small></div>`:`<label for="consolidation">Registre uma síntese para consolidar seu estudo</label><textarea id="consolidation" placeholder="Explique uma decisão, seu motivo e sua aplicação...">${esc(s.consolidation||'')}</textarea><div class="actions"><button id="practiceNext" class="secondary">Salvar síntese e revisar outro conceito</button><button id="finish" class="primary orange" ${canFinish()?'':'disabled'}>Concluir revisão</button></div><p id="timehint" class="small"></p>`}`}
if(t.type==='quiz'||t.type==='retry'){let a=t.type==='quiz'?s.answers[q.id]:s.retryFeedback;body=`<div class="eyebrow">${t.type==='retry'?'Reforço · uma nova chance':'Verificação de aprendizagem'}</div><span class="pill">${esc(q.skill)}</span><h2 style="margin-top:20px">${esc(q.prompt)}</h2><p class="small">${q.source?'Questão original do compêndio.':'Exercício adaptado do modelo SCI.'} Escolha e confirme uma alternativa.</p>${q.options.map((o,i)=>`<button data-option="${i}" class="option ${selection===i?'chosen':''} ${a&&i===q.correct?'right':''} ${a&&a.choice===i&&i!==q.correct?'wrong':''}" ${a?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}${a?`<div class="feedback ${a.choice===q.correct?'':'error'}" role="status"><b>${a.choice===q.correct?'✓ Boa! Você identificou o conceito.':'Vamos trabalhar esse ponto.'}</b>${esc(q.explain)}${a.choice!==q.correct?'<p style="margin:10px 0 0">Esta questão voltará no reforço até você acertar ou o tempo terminar.</p>':''}</div><div class="actions"><button id="qnext" class="primary">Continuar →</button></div>`:`<div class="actions"><button id="confirm" class="primary" ${selection===null?'disabled':''}>Confirmar resposta</button></div>`}`}
if(t.type==='write'){body=`<div class="eyebrow">Aplicação · estação ${t.i+1}</div><h2>Agora, a decisão é sua.</h2><p>${esc(d.writing[t.i])}</p><div class="callout">Organize sua resposta: <b>problema → decisão → justificativa → resultado esperado.</b> Escreva pelo menos 300 caracteres. O professor avaliará o conteúdo.</div><label for="writing">Sua resposta</label><textarea id="writing" placeholder="Escreva sua análise com suas próprias palavras...">${esc(s.writings[t.i])}</textarea><div class="row"><small id="chars">${s.writings[t.i].trim().length}/300 caracteres</small><small>Texto preservado integralmente</small></div><div class="actions"><button id="wnext" class="primary" ${s.writings[t.i].trim().length>=300?'':'disabled'}>Entregar resposta e continuar →</button></div>`}
app.innerHTML=`<div class="wrap"><div class="row" style="margin-bottom:24px"><div><div class="eyebrow">${esc(d.short)} · revisão Prova Paulista</div><h2 style="margin:0">${t.station===2?'Transforme seus erros em aprendizado.':`Estação ${t.station+1} · ${t.station===0?'Entender para decidir':'Aplicar para evoluir'}`}</h2></div><button id="fullscreen" class="secondary" aria-label="Ativar tela cheia">⛶ Tela cheia</button></div><div class="grid"><section class="panel content-panel">${body}</section><aside><div class="panel"><div class="eyebrow">Sua jornada</div><h3>${esc(state.name)}</h3><div class="meter"><i style="width:${Math.min(100,s.pos/s.tasks.length*100)}%"></i></div><p class="small">${s.pos}/${s.tasks.length} etapas · ${s.retry.length} questões para recuperar</p><div class="station ${t.station===0?'active':''}">01 · Entender para decidir</div><div class="station ${t.station===1?'active':''}">02 · Aplicar para evoluir</div><div class="station ${t.station===2?'active':''}">03 · Recuperar e consolidar</div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><p class="small" id="inactive"></p><p class="small">O limite de 45 minutos continua correndo ao sair da página.</p><button id="backhome" class="secondary wide">Voltar à escolha de matéria</button></div></aside></div></div>`;
document.getElementById('backhome').onclick=home;document.getElementById('fullscreen').onclick=()=>{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>toast('Tela cheia não disponível neste navegador. Você pode continuar.'));else toast('Seu navegador permite continuar sem tela cheia.')};
if(t.type==='lesson'){document.getElementById('readcheck').onchange=e=>{s.checks[s.pos]=e.target.checked;save();hud()};document.getElementById('readnext').onclick=()=>{if((s.taskTime[s.pos]||0)>=60&&s.checks[s.pos])advance()}}
if(t.type==='quiz'||t.type==='retry'){document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{selection=Number(b.dataset.option);renderStudy();hud()});const confirm=document.getElementById('confirm');if(confirm)confirm.onclick=()=>answer(t);const next=document.getElementById('qnext');if(next)next.onclick=()=>{if(t.type==='retry'){const i=s.retry.shift();if(s.retryFeedback.choice===q.correct){if(!s.recovered.includes(q.id))s.recovered.push(q.id)}else s.retry.push(i);delete s.retryFeedback;selection=null;save();render()}else advance()}}
if(t.type==='write'){const el=document.getElementById('writing');el.oninput=()=>{s.writings[t.i]=el.value;document.getElementById('chars').textContent=el.value.trim().length+'/300 caracteres';document.getElementById('wnext').disabled=el.value.trim().length<300;save()};document.getElementById('wnext').onclick=()=>{if(s.writings[t.i].trim().length>=300){s.written[t.i]=true;advance()}}}
if(t.type==='practice'){document.getElementById('consolidation').oninput=e=>{s.consolidation=e.target.value;save()};document.getElementById('practiceNext').onclick=()=>{if((s.consolidation||'').trim().length<120){toast('Escreva ao menos 120 caracteres para consolidar este conceito.');return}s.notes=s.notes||[];s.notes.push({lesson:t.i,text:s.consolidation});s.consolidation='';s.practice++;save();render()};document.getElementById('finish').onclick=()=>{if(canFinish())finish(false)}}hud()}
function advance(){const s=S();s.pos++;selection=null;save();render();window.scrollTo(0,0)}function answer(t){const s=S(),q=D().questions[t.i];if(selection===null||s.status!=='active'||(t.type==='quiz'&&s.answers[q.id]))return;if(Date.now()-s.started>=2700000){finish(true);return}const a={choice:selection,seconds:s.taskTime[s.pos]||0,at:Date.now()};if(t.type==='quiz'){s.answers[q.id]=a;if(selection!==q.correct)s.retry.push(t.i)}else{s.retryFeedback=a;s.attempts.push({id:q.id,...a})}selection=null;save();render()}
function canFinish(){const s=S();return s&&s.status==='active'&&s.active>=1500&&s.pos>=s.tasks.length&&s.retry.length===0&&s.written.every(Boolean)}function finish(expired){const s=S();s.status=expired?'expired':'completed';s.ended=expired?s.started+2700000:Date.now();save();renderResult()}
function stats(){const s=S(),d=D();const correct=d.questions.filter(q=>s.answers[q.id]?.choice===q.correct).length;const content=(correct+s.written.filter(Boolean).length)/(d.questions.length+2)*10;return {correct,content,grade:Math.max(0,content-s.vacilos)}}
function chart(){const d=D(),s=S();return [...new Set(d.questions.map(q=>q.skill))].map(k=>{const qs=d.questions.filter(q=>q.skill===k);let good=0,rec=0,pending=0,none=0;qs.forEach(q=>{if(!s.answers[q.id])none++;else if(s.answers[q.id].choice===q.correct)good++;else if(s.recovered.includes(q.id))rec++;else pending++});return `<div class="chartrow"><div class="row"><b style="font-size:14px">${esc(k)}</b><small>${good} acertos · ${rec} recuperadas · ${pending} pendentes${none?' · '+none+' não avaliadas':''}</small></div><div class="bar" role="img" aria-label="${esc(k)}: ${good} acertos iniciais, ${rec} recuperadas, ${pending} pendentes, ${none} não avaliadas"><span class="initial" style="width:${good/qs.length*100}%"></span><span class="recovered" style="width:${rec/qs.length*100}%"></span><span class="pending" style="width:${pending/qs.length*100}%"></span></div></div>`}).join('')}
function reportHTML(){const d=D(),s=S(),st=stats();return `<h1>Trilha do Conhecimento</h1><h2>${esc(d.title)}</h2><p><b>Estudante:</b> ${esc(state.name)}<br>Data: ${new Date(s.started).toLocaleString('pt-BR')}<br>Status: ${s.status==='completed'?'Concluída':'Tempo encerrado — verificar pendências'}<br>Tempo corrido: ${fmt((s.ended-s.started)/1000)} · Ativo: ${fmt(s.active)}<br>Acertos iniciais: ${st.correct}/${d.questions.length} · Recuperadas: ${s.recovered.length}<br>Nota de conteúdo: ${st.content.toFixed(1)} · Vacilos: ${s.vacilos} · Média: ${st.grade.toFixed(1)}</p><p>${esc(d.note)}</p><p>A escrita pontua pela entrega; seu conteúdo depende da avaliação do professor. O reforço não substitui o resultado da primeira tentativa.</p><h2>Respostas do quiz</h2>${d.questions.map(q=>{const a=s.answers[q.id];return `<div class="report-q"><h3>${esc(q.skill)} · ${esc(q.prompt)}</h3><p>Marcada: ${a?esc(q.options[a.choice]):'Não respondida'}<br>Correta: ${esc(q.options[q.correct])}<br>Primeira tentativa: ${a?(a.choice===q.correct?'acerto':'erro'):'não avaliada'} · Tempo ativo na questão: ${fmt(a?.seconds||0)}<br>Reforço: ${s.recovered.includes(q.id)?'recuperada':a&&a.choice!==q.correct?'pendente':'não necessário'}</p><p>${esc(q.explain)}</p>${s.attempts.filter(x=>x.id===q.id).map((x,i)=>`<p>Reforço ${i+1}: ${esc(q.options[x.choice])} — ${x.choice===q.correct?'acerto':'erro'}</p>`).join('')}</div>`}).join('')}<h2>Produções escritas</h2>${d.writing.map((w,i)=>`<section><h3>Estação ${i+1}</h3><p>${esc(w)}</p><p>Status: ${s.written[i]?'entregue — aguardando avaliação docente':'pendente'}</p><div class="student-text">${esc(s.writings[i]||'Não respondida.')}</div></section>`).join('')}<h2>Sínteses de consolidação</h2>${(s.notes||[]).map(n=>`<h3>${esc(d.lessons[n.lesson].title)}</h3><div class="student-text">${esc(n.text)}</div>`).join('')}<div class="student-text">${esc(s.consolidation||'')}</div><h2>Registros de foco</h2>${s.events.map(e=>`<p>${fmt((e.at-s.started)/1000)} · ${esc(e.type)}</p>`).join('')}<p>Este documento registra a resposta enviada pelo estudante. Dados salvos localmente no navegador; registro de foco não comprova fraude.</p>`}
function renderResult(){document.getElementById('hud').innerHTML='';const s=S(),d=D(),st=stats();app.innerHTML=`<div class="wrap"><div class="eyebrow">Seu mapa de aprendizagem</div><h1>${s.status==='completed'?'Uma revisão. Novas conquistas.':'Tempo encerrado. Aprendizado registrado.'}</h1><p style="margin-top:18px">${esc(state.name)}, veja o que você acertou e o que ainda merece atenção em <b>${esc(d.title)}</b>.</p>${s.status==='expired'?'<div class="note">O limite de 45 minutos foi atingido. Esta sessão não será marcada como concluída se houver atividades pendentes ou menos de 25 minutos ativos.</div>':''}<div class="statgrid"><div class="stat"><small>Acertos na primeira tentativa</small><strong>${st.correct}/${d.questions.length}</strong></div><div class="stat"><small>Questões recuperadas</small><strong>${s.recovered.length}</strong></div><div class="stat"><small>Tempo de estudo ativo</small><strong>${fmt(s.active)}</strong></div></div><div class="grid"><section class="panel"><h2>Onde você evoluiu</h2><p class="small">Diagnóstico baseado nas questões respondidas, sem estimar habilidades não avaliadas.</p><div class="legend"><span><i class="dot" style="background:#2a629a"></i>Acerto inicial</span><span><i class="dot" style="background:#10b981"></i>Recuperada</span><span><i class="dot" style="background:#ff7a00"></i>Pendente</span><span><i class="dot" style="background:#e7edf4"></i>Não avaliada</span></div>${chart()}<div class="note">${esc(d.note)}</div></section><aside class="panel"><div class="ring" style="background:conic-gradient(#2a629a ${st.grade*10}%,#e7edf4 0)"><span>${st.grade.toFixed(1)}</span></div><h3 style="text-align:center">Média da atividade</h3><p class="small">Conteúdo ${st.content.toFixed(1)} − ${s.vacilos} vacilo(s). Escritas: ${s.written.filter(Boolean).length}/2 entregues. Pontuação da escrita por entrega, com avaliação de conteúdo pelo professor.</p><button id="printbtn" class="primary wide">Imprimir / salvar PDF</button><button id="mdbtn" class="secondary wide" style="margin-top:12px">Exportar boletim .MD</button><button id="choose" class="secondary wide" style="margin-top:12px">Escolher outra revisão</button></aside></div><details><summary>Conferir todas as respostas e produções</summary>${reportHTML()}</details></div>`;document.getElementById('print').innerHTML=reportHTML();document.getElementById('printbtn').onclick=()=>window.print();document.getElementById('choose').onclick=home;document.getElementById('mdbtn').onclick=()=>{const el=document.createElement('div');el.innerHTML=reportHTML().replace(/<\/p>|<\/h[123]>|<\/div>|<br>/g,'\n$&');const blob=new Blob([el.textContent],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='boletim-'+state.current+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
function vacilo(type){const s=S();if(!s||s.status!=='active'||Date.now()-s.started>=2700000)return;s.vacilos++;s.events.push({type,at:Date.now()});save();toast(`${state.name.split(' ')[0]}, ${type==='Troca de aba'?'vamos retomar o foco?':'escreva com suas próprias palavras.'} Vacilo registrado (−1 ponto).`);hud()}
['pointerdown','keydown','scroll','touchstart'].forEach(ev=>document.addEventListener(ev,()=>lastInteraction=Date.now(),{passive:true}));document.addEventListener('visibilitychange',()=>{if(document.hidden)vacilo('Troca de aba');lastTick=Date.now()});document.addEventListener('paste',e=>{if(e.target.tagName==='TEXTAREA'&&S()?.status==='active'){e.preventDefault();vacilo('Tentativa de colar')}});document.addEventListener('drop',e=>{if(e.target.tagName==='TEXTAREA'&&S()?.status==='active'){e.preventDefault();vacilo('Tentativa de arrastar texto')}});document.addEventListener('contextmenu',e=>{if(S()?.status==='active')e.preventDefault()});document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='q'&&S()){e.preventDefault();S().vacilos=0;S().events.push({type:'Vacilos zerados pelo atalho do professor',at:Date.now()});save();render()}});setInterval(()=>{const now=Date.now(),delta=Math.min(2,(now-lastTick)/1000);lastTick=now;const s=S();if(!s||s.status!=='active')return;if(now-s.started>=2700000){finish(true);return}if(!document.hidden&&now-lastInteraction<60000){s.active+=delta;s.taskTime[s.pos]=(s.taskTime[s.pos]||0)+delta}save();hud()},1000);
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_learning_progress',description:'Consulta o progresso local e as dificuldades registradas, sem responder atividades.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute:()=>({student:state.name,subjects:Object.entries(state.sessions).map(([k,s])=>({subject:DATA[k].title,status:s.status,activeSeconds:Math.floor(s.active),pendingQuestions:s.retry.length,recovered:s.recovered.length}))})})).catch(()=>{})}catch{}}render();
</script></body></html>
